# Pi Google Home — Default ALSA Audio Routing Configuration
#
# Hardware Targets:
# - Playback: 15" HDMI Monitor speakers via Broadcom VC4 HDMI audio sink (vc4hdmi)
# - Capture:  JOUNIVO USB Conference Microphone (MICROPHONE)

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "hw:vc4hdmi,0"
    }
    capture.pcm {
        type plug
        slave {
            pcm "hw:MICROPHONE,0"
            channels 1
            rate 16000
            format S16_LE
        }
    }
}

ctl.!default {
    type hw
    card "vc4hdmi"
}
